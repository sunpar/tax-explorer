[project]
name = "tax-explorer"
version = "0.1.0"
description = "Explore tax burden across income levels for US W-2 filers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.38",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
]

[project.scripts]
tax-explorer = "tax_explorer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/tax_explorer"]
